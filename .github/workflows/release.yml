name: release

# A v* tag builds wyk on a GitHub-hosted runner, gets wyk-host.exe
# Authenticode-signed with the maintainer's YubiKey (mfilippov/github-codesign),
# proves the signed files are exactly that build plus the signature, and
# creates a draft release with build provenance for every published file.

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: check tag
        run: '[[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # a release is built from scratch
      - run: scripts/build.sh "$GITHUB_REF_NAME" dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*/wyk-host.exe
      # wyk-host.exe embeds the relay, so it is the only file to sign and release.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: dist/*/wyk-host.exe
          if-no-files-found: error

  sign:
    needs: build
    runs-on: codesign
    environment: codesign
    timeout-minutes: 60
    permissions: {}
    steps:
      - id: sign
        uses: mfilippov/github-codesign/request-signature@7e672775e21df021ad0878d651157fbef9c302f3 # v1.0.5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed
          path: ${{ steps.sign.outputs.dir }}
          if-no-files-found: error

  release:
    needs: sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: unsigned, path: unsigned }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: signed, path: signed }
      # Checks each unsigned exe against this workflow's attestation for this
      # commit, then that the signed one is it plus our signature.
      - uses: mfilippov/github-codesign/verify-signed@7e672775e21df021ad0878d651157fbef9c302f3 # v1.0.5
        with: { signed: signed, unsigned: unsigned }
      - name: package
        run: |
          set -euo pipefail
          mkdir release
          for arch in amd64 arm64; do
            cp "signed/$arch/wyk-host.exe" "release/wyk-$GITHUB_REF_NAME-$arch.exe"
          done
          (cd release && sha256sum -- *.exe >SHA256SUMS)
          cat release/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*
      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "wyk $GITHUB_REF_NAME" release/*
